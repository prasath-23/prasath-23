<svg xmlns="http://www.w3.org/2000/svg" width="850" height="284" viewBox="0 0 850 284" role="img" aria-labelledby="t">
<title id="t">Alora Auth (Go): multi-tenant identity provider &amp; SSO for B2B products. Sign in once with a password, Google or company SSO, then open each product. with a short-lived token of its own. Services and AI agents get tokens too.. refresh-token rotation with reuse detection · append-only audit log · tenant isolation.</title>
