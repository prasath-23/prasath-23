 fill="#c9d1d9">Gin</text></g><g transform="translate(161,230)"><rect x=".5" y=".5" width="131" height="27" rx="7" fill="#161b22" stroke="#30363d"/><circle cx="14" cy="14" r="3" fill="#34bcf4"/><text x="24" y="18.4" class="sans" font-size="12.5" font-weight="500" fill="#c9d1d9">PostgreSQL 16</text></g><g transform="translate(301,230)"><rect x=".5" y=".5" width="74" height="27" rx="7" fill="#161b22" stroke="#30363d"/><circle cx="14" cy="14" r="3" fill="#4ea2ef"/><text x="24" y="18.4" class="sans" font-size="12.5" font-weight="500" fill="#c9d1d9">gRPC</text></g><g transform="translate(384,230)"><rect x=".5" y=".5" width="136" height="27" rx="7" fill="#161b22" stroke="#30363d"/><circle cx="14" cy="14" r="3" fill="#6787ea"/><text x="24" y="18.4" class="sans" font-size="12.5" font-weight="500" fill="#c9d1d9">OAuth2 + PKCE</text></g><g transform="translate(529,230)"><rect x=".5" y=".5" width="128" height="27" rx="7" fill="#161b22" stroke="#30363d"/><circle cx="14" cy="14" r="3" fill="#816ce5"/><text x="24" y="18.4" class="sans" font-size="12.5" font-weight="500" fill="#c9d1d9">RS256 · JWKS</text></g><g transform="translate(666,230)"><rect x=".5" y=".5" width="92" height="27" rx="7" fill="#161b22" stroke="#30363d"/><circle cx="14" cy="14" r="3" fill="#9b51e0"/><text x="24" y="18.4" class="sans" font-size="12.5" font-weight="500" fill="#c9d1d9">Argon2id</text></g>
